name: CI

on:
  push:
    branches: [main, 'baton/**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: registry.caaat.pro
  IMAGE_NAME: baton

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # The CLI launches child processes and serves HTTP on every supported
        # desktop platform. Keep macOS in the normal release gate rather than
        # treating it as an unverified compatibility target.
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  native-sqlite-node26:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify hooks keep regular-file stdin open before synchronous Git detection
        run: npm run test:hook-stdin-file-smoke
      - name: Verify the optional SQLite runtime loads on Node 26
        run: >-
          node -e "const Database = require('better-sqlite3'); const db = new Database(':memory:'); const row = db.prepare('select 1 as value').get(); db.close(); if (row.value !== 1) process.exit(1);"

  central-postgres:
    # Central-server and TEST 8 suites against a real pgvector service; they
    # skip elsewhere when Docker is missing, so this job is the mandatory gate.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: baton
          POSTGRES_PASSWORD: baton
          POSTGRES_DB: baton
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U baton -d baton"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      BATON_TEST_PG_URL: postgres://baton:baton@127.0.0.1:5432/baton
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx vitest run tests/central

  compose-acceptance:
    # All acceptance suites against the Docker Compose deployment, plus the
    # deployed server over HTTPS and a backup -> destroy -> restore drill.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: deploy/acceptance.sh

  docker-control-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the published HTTP control-plane image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: baton:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
      - name: Verify the image starts and becomes healthy
        run: |
          set -euo pipefail
          docker run --detach --rm --name baton-ci -p 3211:3211 \
            --env BATON_HTTP_ALLOW_UNAUTHENTICATED_BIND=1 \
            baton:ci
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3211/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs baton-ci
          exit 1
      - name: Remove the verification container
        if: always()
        run: docker rm --force baton-ci || true

  publish-image:
    # Pushes of the default branch and version tags only (never PRs or the
    # baton/** branches), after every other job passed. The build reuses the
    # layers docker-control-plane cached, so it does not compile again.
    if: github.event_name == 'push' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))
    needs: [test, typecheck, native-sqlite-node26, central-postgres, compose-acceptance, docker-control-plane]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: publish-image-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to the registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Baton Hub
      - name: Push the image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          provenance: false
      - name: Summary
        run: |
          {
            echo "### Image"
            echo "Published to \`${REGISTRY}/${IMAGE_NAME}\`:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
