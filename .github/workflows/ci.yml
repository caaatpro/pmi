name: CI

on:
  push:
    branches: [main, 'pmi/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # The CLI launches child processes and serves HTTP on every supported
        # desktop platform. Keep macOS in the normal release gate rather than
        # treating it as an unverified compatibility target.
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  native-sqlite-node26:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify hooks keep regular-file stdin open before synchronous Git detection
        run: npm run test:hook-stdin-file-smoke
      - name: Verify the optional SQLite runtime loads on Node 26
        run: >-
          node -e "const Database = require('better-sqlite3'); const db = new Database(':memory:'); const row = db.prepare('select 1 as value').get(); db.close(); if (row.value !== 1) process.exit(1);"

  central-postgres:
    # Central-server and TEST 8 suites against a real pgvector service; they
    # skip elsewhere when Docker is missing, so this job is the mandatory gate.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: pmi
          POSTGRES_PASSWORD: pmi
          POSTGRES_DB: pmi
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pmi -d pmi"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PMI_TEST_PG_URL: postgres://pmi:pmi@127.0.0.1:5432/pmi
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx vitest run tests/central

  compose-acceptance:
    # All acceptance suites against the Docker Compose deployment, plus the
    # deployed server over HTTPS and a backup -> destroy -> restore drill.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: deploy/acceptance.sh

  docker-control-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the published HTTP control-plane image
        run: docker build --tag memorix:ci .
      - name: Verify the image starts and becomes healthy
        run: |
          set -euo pipefail
          docker run --detach --rm --name memorix-ci -p 3211:3211 \
            --env MEMORIX_HTTP_ALLOW_UNAUTHENTICATED_BIND=1 \
            memorix:ci
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3211/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs memorix-ci
          exit 1
      - name: Remove the verification container
        if: always()
        run: docker rm --force memorix-ci || true
