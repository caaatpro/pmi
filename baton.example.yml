# ============================================================
# baton.yml — Baton Configuration
# ============================================================
#
# Two files, two roles:
#   baton.yml  → behavior settings (this file)
#   .env         → secrets only (API keys) — see .env.example
#
# Place this file at:
#   - Project root (./baton.yml)  — project-specific settings
#   - User home (~/.baton/baton.yml) — global defaults (advanced)
#
# Priority: env > .env > project baton.yml > user baton.yml > defaults
#
# Docs: https://github.com/caaatpro/pmi

# ── LLM Configuration ────────────────────────────────────────
# Used for smart dedup, fact extraction, and memory formation.
# Optional — Baton works without LLM (free heuristic mode).
# API key goes in .env as BATON_LLM_API_KEY
llm:
  provider: openai          # openai, anthropic, openrouter, requesty, apiroute, cheaperinference, or custom endpoint
  model: gpt-4o-mini
  # baseUrl: https://api.openai.com/v1

# ── Embedding / Vector Search ──────────────────────────────
# Enables semantic search alongside BM25 fulltext.
# API key goes in .env as BATON_EMBEDDING_API_KEY.
# For OpenRouter embedding endpoints, OPENROUTER_API_KEY is also accepted.
# For Requesty embedding endpoints, REQUESTY_API_KEY is also accepted.
embedding:
  provider: off             # off (default), api, fastembed, transformers, auto
  # model: text-embedding-3-small
  # baseUrl: https://openrouter.ai/api/v1
  # model: qwen/qwen3-embedding-8b
  # dimensions: 1024        # Override auto-detected dimensions

# ── HTTP rerank (optional) ───────────────────────────────────
# Cohere-compatible POST {baseUrl}/rerank. Model id is sent as configured.
# Bearer inherits BATON_LLM_API_KEY only when baseUrl is that same endpoint.
# A different rerank host requires BATON_RERANK_API_KEY / rerank.apiKey.
# rerank:
#   provider: http
#   model: rerank-model
#   baseUrl: https://api.example.com/v1

# ── Git-Memory Pipeline ──────────────────────────────────────
# Automatically capture engineering knowledge from git commits.
# Every commit becomes a searchable, immutable memory.
git:
  autoHook: false           # Auto-install post-commit hook on first serve
  ingestOnCommit: true      # Ingest HEAD commit via post-commit hook
  maxDiffSize: 500          # Max diff chars included in memory
  skipMergeCommits: true    # Skip merge commits (usually noise)
  # excludePatterns:        # File glob patterns — commits touching ONLY these are skipped
  #   - "*.lock"
  #   - "dist/**"
  # noiseKeywords:          # Literal phrases (case-insensitive) — matching commits are skipped
  #   - "bot:"              # Skip bot-generated commits
  #   - "auto-deploy"       # Skip CI deploy commits

# ── CodeGraph Memory ──────────────────────────────────────────
# Build an incremental local code map for task context. Large generated files
# are skipped by default; lower this only when a repository needs it.
# codegraph:
#   # excludePatterns: ["vendor/**", "generated/**"]
#   maxFileBytes: 2097152   # 2 MiB default per source file

# ── Behavior Settings ────────────────────────────────────────
behavior:
  sessionInject: minimal    # full | minimal | silent
  syncAdvisory: true        # Show cross-agent sync hint on first search
  autoCleanup: true         # Auto-archive expired memories on startup
  formationMode: active     # active | shadow | fallback

# ── Server Configuration ─────────────────────────────────────
server:
  transport: stdio          # stdio (default) or http
  # port: 37850             # HTTP port (only for http transport)
  dashboard: true           # Enable Web Dashboard
  dashboardPort: 3210       # Dashboard port

# ── Team Collaboration ───────────────────────────────────────
# team:
#   enabled: false
#   workspaceCollection: workspace_memory

