# Baton central server: Postgres (pgvector) + baton-server + Caddy (TLS).
#
#   cp .env.example .env    # set POSTGRES_PASSWORD and BATON_DOMAIN
#   docker login registry.caaat.pro
#   docker compose pull && docker compose up -d --wait
#   docker compose exec baton-server node dist/server/central/main.js create-org acme
#
# Only Caddy publishes ports; Postgres and baton-server stay on the internal network.
name: baton

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: baton
      POSTGRES_USER: baton
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baton -d baton"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  baton-server:
    # CI publishes the image to registry.caaat.pro from main (`latest`,
    # `sha-<short>`) and version tags; `up --build` builds it from this checkout.
    image: ${BATON_IMAGE:-registry.caaat.pro/baton:latest}
    build:
      context: ..
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BATON_DATABASE_URL: postgres://baton:${POSTGRES_PASSWORD}@postgres:5432/baton
      BATON_HOST: 0.0.0.0
      BATON_PORT: "7420"
      BATON_BLOB_DIR: /data/blobs
      # Caddy is the only client; take the real address from X-Forwarded-For.
      BATON_TRUST_PROXY: "1"
      BATON_METRICS_TOKEN: ${BATON_METRICS_TOKEN:-}
      BATON_BLOB_KEY: ${BATON_BLOB_KEY:-}
    volumes:
      - blob-data:/data
    # `serve` applies pending migrations under an advisory lock before listening.
    entrypoint: ["node", "dist/server/central/main.js"]
    command: ["serve"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7420/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6
    networks: [internal]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      baton-server:
        condition: service_healthy
    environment:
      BATON_DOMAIN: ${BATON_DOMAIN:-localhost}
    ports:
      - "${BATON_HTTP_PORT:-80}:80"
      - "${BATON_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [internal]

volumes:
  pg-data:
  blob-data:
  caddy-data:
  caddy-config:

networks:
  internal:
